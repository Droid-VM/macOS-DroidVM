name: kernel

# Builds the UniXNU XNU kernel (unixnu build kernel) on a macOS runner.
# The kernel links Apple kexts from the IPSW kernelcache, so the binaries are
# uploaded encrypted with the ARTIFACT_KEY secret; only the logs are plain.

on:
  workflow_dispatch:
    inputs:
      device:
        description: device repository (sheng = upstream UniXNU-sheng)
        default: sheng
        type: choice
        options: [sheng]
      defconfig:
        description: defconfig name (empty = <device>_defconfig)
        default: ''
      unixnu_ref:
        description: UniXNU commit or branch
        default: fb2bb310564ce66779e472a021881cf7c5764919
      sheng_ref:
        description: UniXNU-sheng commit or branch
        default: 7562a779ebdbdedc17c4c7274ba993acbbec8188
      xcode:
        description: Xcode application on the runner (empty = the runner default)
        default: ''
      runner:
        description: macOS runner image
        default: macos-26
  # Manual only: the DroidVM mainline (Droid-VM/UniXNU-droidvm) is built by mainline.yml.

jobs:
  kernel:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 300
    env:
      DEVICE: ${{ inputs.device || 'sheng' }}
      UNIXNU_REF: ${{ inputs.unixnu_ref || 'fb2bb310564ce66779e472a021881cf7c5764919' }}
      SHENG_REF: ${{ inputs.sheng_ref || '7562a779ebdbdedc17c4c7274ba993acbbec8188' }}
      XCODE: ${{ inputs.xcode }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain
        run: |
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -f mig iig || true
          brew install llvm lld cmake ninja unifdef mtools dtc
          python3 -m pip install --upgrade pip

      - name: Sources
        run: |
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git UniXNU
          git -C UniXNU checkout "$UNIXNU_REF"
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU-sheng.git device
          git -C device checkout "$SHENG_REF"
          git -C device submodule update --init --recursive --filter=blob:none
          # Local overrides of UniXNU modules (drivers/<name>, kits/<name>, scripts/...): the same layout as UniXNU.
          if [ -d ci/local ]; then echo "UNIXNU_LOCAL=--local $PWD/ci/local" >> "$GITHUB_ENV"; fi
          git -C UniXNU log --oneline -1

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('UniXNU/feeds.toml', 'device/feeds.toml') }}

      - name: Fetch
        working-directory: UniXNU
        run: |
          ./unixnu defconfig "${{ inputs.defconfig || format('{0}_defconfig', env.DEVICE) }}" -D ../device
          ./unixnu fetch
          ./unixnu status $UNIXNU_LOCAL || true

      - name: Prefetch API listings
        # prepare-xnu-source.py lists directories with the unauthenticated GitHub API, which is rate limited on
        # shared runners; fill its cache with authenticated requests instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sources="UniXNU/out/$DEVICE/tree/.cache/sources"
          mkdir -p "$sources"
          api=repos/apple-oss-distributions/xnu/contents
          gh api "$api/iokit/DriverKit?ref=xnu-10063.121.3" > "$sources/xnu-driverkit-10063.121.3.json"
          gh api "$api/iokit/DriverKit/crypto?ref=xnu-10063.121.3" > "$sources/xnu-driverkit-crypto-10063.121.3.json"
          gh api "$api/EXTERNAL_HEADERS/TrustCache?ref=xnu-8796.101.5" > "$sources/xnu-trustcache-8796.101.5.json"
          ls -la "$sources"

      - name: Owner root policies
        # VerifiedRoot manifests of the OS and SystemOS disks (scripts/make-virt-root.py on the host), published encrypted
        # as the release asset root-policies/verified-root-inputs.tar.enc; build-virt-verified-root.py embeds them.
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if gh release view root-policies --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download root-policies --repo "$GITHUB_REPOSITORY" --pattern verified-root-inputs.tar.enc --dir "$RUNNER_TEMP"
            inputs="UniXNU/out/$DEVICE/tree/build/verified-root-inputs"
            mkdir -p "$inputs"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/verified-root-inputs.tar.enc" | tar -xz -C "$inputs"
            ls -la "$inputs"
          else
            echo "no root-policies release"
          fi

      - name: Build kernel
        working-directory: UniXNU
        run: |
          jobs="-j $(sysctl -n hw.ncpu)"
          tree="out/$DEVICE/tree"
          record="$tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json"
          if [ ! -f "$record" ]; then
            # From scratch the bootstrap pass stops at its archive checks before make (headers and firehose are
            # installed by then): give it empty archives, then run the real build.
            ./unixnu build kernel $jobs $UNIXNU_LOCAL || echo "== first pass stopped as expected on a clean tree"
            python3 ../ci/scripts/placeholder-archives.py "$tree"
          fi
          ./unixnu build kernel $jobs $UNIXNU_LOCAL

      - name: Storage audit
        # Qualifies the original IOBlockStorageDevice dispatch against the prelinked candidate; the JSON holds only
        # addresses and symbol names, and is recorded in the device repository for the NativeVirtioBlock bindings.
        if: always() && hashFiles(format('UniXNU/out/{0}/kernel/kernel.macho', env.DEVICE)) != '' && hashFiles(format('UniXNU/out/{0}/tree/scripts/audit-storage-interface-static.py', env.DEVICE)) != ''
        working-directory: UniXNU/out/${{ env.DEVICE }}/tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/collect/audit"
          # Once NativeVirtioBlock is linked, its bindings export the original storage names and the candidate no longer
          # qualifies; the recorded audit (scripts/data) stays valid, so this part is informative only.
          if python3 scripts/audit-storage-interface-static.py ../kernel/kernel.macho; then
            cp build/storage-abi/interface-audit.json "$GITHUB_WORKSPACE/collect/audit/"
          else
            echo "::warning::storage audit did not qualify this candidate (expected with NativeVirtioBlock linked)"
          fi
          # Original IOHIDDevice bindings for NativeHidInput: the UniXNU builder qualifies them on a prelinked candidate.
          if [ -f drivers/NativeHidInput/NativeHidInput.cpp ]; then
            mkdir -p build/native-prelink
            cp ../kernel/kernel.macho build/native-prelink/native-owner-ufs-cpu-desktop-ci-candidate.macho
            cp ../kernel/kernel.json build/native-prelink/native-owner-ufs-cpu-desktop-ci-candidate.json
            python3 scripts/build-native-hid-input.py
            cp build/native-hid-input/OriginalHidDeviceABI.h build/native-hid-input/abi-audit.json "$GITHUB_WORKSPACE/collect/audit/"
            cp build/native-hid-input/original-bindings.S "$GITHUB_WORKSPACE/collect/audit/hid-original-bindings.S"
          fi
          # Original IOMobileFramebufferLegacy ABI and bindings for NativeLegacyDisplay (needs IOMobileGraphicsFamily prelinked).
          if [ -f scripts/record-virt-display.py ]; then
            python3 scripts/record-virt-display.py ../kernel/kernel.macho "$GITHUB_WORKSPACE/collect/audit" 2>&1 \
              || echo "::warning::legacy display bindings not recorded"
          fi

      - name: Upload storage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-audit-${{ env.DEVICE }}
          path: collect/audit
          if-no-files-found: ignore

      - name: Collect
        if: always()
        run: |
          board=$(ls -d UniXNU/out/*/ | grep -v -E '/(feeds|ipsw)/$' | head -1)
          echo "board dir: $board"
          mkdir -p collect
          [ -d "$board/logs" ] && cp -R "$board/logs" collect/logs || true
          if [ -d "$board/tree/build" ]; then
            (cd "$board/tree" && find build -maxdepth 4 \( -name '*.a' -o -name 'mach.*' -o -name '*.json' \) -type f -size -400M \
               | tar -cf - -T -) > collect/build.tar || true
          fi
          # Two encrypted artifacts: the prelinked kernel alone (what a boot test needs) and the rest of the build.
          [ -d "$board/kernel" ] && tar -czf kernel.tgz -C "$board" kernel || true
          [ -s collect/build.tar ] && gzip -c collect/build.tar > build.tgz || true
          if [ -n "$ARTIFACT_KEY" ]; then
            for name in kernel build; do
              [ -s $name.tgz ] && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in $name.tgz -out $name.tgz.enc
            done
          fi
          ls -la collect *.tgz* || true
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.DEVICE }}
          path: collect/logs
          if-no-files-found: ignore

      - name: Upload kernel (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}
          path: kernel.tgz.enc
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - name: Upload build (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.DEVICE }}
          path: build.tgz.enc
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
