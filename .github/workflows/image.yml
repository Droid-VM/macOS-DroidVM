name: image

# The k27 product from nothing on a hosted runner: the build environment from public sources (scripts/setup-env.py,
# configs/env.lock.json), Apple's files from the IPSWs (product.py inputs), a new install (product.py disk, stage) and the boot disk
# (product.py full). docs/ci-env-plan.md has the design.
#
# Everything holding Apple's files is stored encrypted with the ARTIFACT_KEY secret (scripts/ci-blob.sh: tar | zstd | AES-256 |
# parts of 1900 MB):
# - the IPSW inputs (artifacts/TAG without disk/, out/kc/kc27.bin: about 16 GB, too much for the 10 GB of actions/cache) as the
#   assets of the release inputs-TAG-KEY, KEY a hash of the product's "inputs" and the two IPSW profiles: made once, then downloaded;
# - the image (boot.img, the new install's data-store.img, scratch-data.img and disk.json, manifests) as the run's artifact
#   image-TAG-RUN, and with release=true also as the assets of a release.
# Unpack: ARTIFACT_KEY=... scripts/ci-blob.sh unpack DIR image.tar.zst.enc.[0-9][0-9][0-9]
# Logs, hashes and the manifest are plain.
#
# Caches (actions/cache): toolchains/ (keyed on the lock and the setup scripts), ccache (the kernel and Turnip; MACOS_CCACHE), the
# bridge's cargo target directory. The new install's user is the MACOS_USER secret (NAME:PASSWORD) or the product's (disk.user).

on:
  workflow_dispatch:
    inputs:
      refresh_inputs:
        description: Fetch the IPSW inputs again and replace their release
        type: boolean
        default: false
      release:
        description: Also publish the image (encrypted parts) as a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      MACOS_USER: ${{ secrets.MACOS_USER }}
      GH_TOKEN: ${{ github.token }}
      MACOS_CCACHE: /usr/bin/ccache
      CCACHE_MAXSIZE: 3G
      TAG: '27.2'
    steps:
      - name: Disk space
        # The workspace lives on the runner's second disk (/mnt) through a bind mount, so its path stays inside the job's
        # workspace (the Darling container mounts it by that path); / keeps the packed parts.
        run: |
          [ -n "$ARTIFACT_KEY" ] || { echo "::error::the ARTIFACT_KEY secret is not set"; exit 1; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws
          mkdir -p ws && sudo mount --bind /mnt/ws ws
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ws/.ccache" >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: actions/checkout@v4
        with:
          path: ws

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Host packages
        working-directory: ws
        run: |
          lock() { python3 -c "import json,sys; d=json.load(open('configs/env.lock.json')); print(eval(sys.argv[1]))" "$1"; }
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" "$(lock "d['host']['llvm']['version']")"
          # docker.io: the runner has Docker already
          sudo apt-get update -q
          sudo apt-get install -y -q $(lock "' '.join(p for p in d['host']['apt'] if p != 'docker.io')") "linux-headers-$(uname -r)"
          python3 -m pip install -q $(lock "' '.join(d['host']['python']['pip'])")
          rust=$(lock "d['host']['rust']['toolchain']")
          rustup toolchain install "$rust" --profile minimal --component $(lock "','.join(d['host']['rust']['components'])")
          echo "MACOS_RUST_TOOLCHAIN=$rust" >> "$GITHUB_ENV"
          echo "MACOS_FDT=$PWD/configs/k27-generated.dtb" >> "$GITHUB_ENV"
          echo "INPUTS_KEY=$(python3 -c "
          import hashlib, json
          c = json.load(open('configs/product-k27.json'))
          h = hashlib.sha256(json.dumps(c['inputs'], sort_keys=True).encode())
          for s in c['inputs']['ipsws']:
              h.update(open(s['profile'], 'rb').read())
          print(h.hexdigest()[:16])")" >> "$GITHUB_ENV"
          meson --version; clang-21 --version | head -1; cargo "+$rust" --version

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: ws/toolchains
          key: toolchains-${{ hashFiles('ws/configs/env.lock.json', 'ws/scripts/setup-env.py', 'ws/compat/xnu-linux/**', 'ws/scripts/apple-ld.py') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ws/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Cache bridge
        uses: actions/cache@v4
        with:
          path: |
            ws/out/metal/bridge/target
            ~/.cargo/registry
          key: bridge-${{ hashFiles('ws/configs/metal-bridge.Cargo.lock', 'ws/configs/env.lock.json', 'ws/patches/metal2vulkan-macos/**') }}
          restore-keys: bridge-

      - name: Build environment
        working-directory: ws
        run: |
          python3 scripts/setup-env.py toolchain
          python3 scripts/setup-env.py x12377
          python3 scripts/setup-env.py sources
          df -h /mnt

      - name: IPSW inputs
        working-directory: ws
        env:
          REFRESH: ${{ inputs.refresh_inputs }}
        run: |
          release="inputs-$TAG-$INPUTS_KEY"
          parts="$RUNNER_TEMP/inputs"
          if [ "$REFRESH" != true ] && gh release view "$release" >/dev/null 2>&1; then
            gh release download "$release" --dir "$parts"
            (cd "$parts" && sha256sum -c inputs.tar.zst.enc.sha256)
            scripts/ci-blob.sh unpack . "$parts"/inputs.tar.zst.enc.[0-9][0-9][0-9]
            rm -rf "$parts"
            echo "inputs from the release $release"
          else
            python3 scripts/product.py inputs
            scripts/ci-blob.sh pack "$parts/inputs.tar.zst.enc" . "artifacts/$TAG" out/kc/kc27.bin
            gh release delete "$release" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create "$release" --prerelease --title "IPSW inputs $TAG ($INPUTS_KEY, encrypted)" \
              --notes "product.py inputs of configs/product-k27.json (key $INPUTS_KEY): artifacts/$TAG and out/kc/kc27.bin, ARTIFACT_KEY encrypted (scripts/ci-blob.sh)."
            gh release upload "$release" "$parts"/inputs.tar.zst.enc.*
            rm -rf "$parts"
          fi
          du -sh "artifacts/$TAG"
          df -h /mnt

      - name: New install
        working-directory: ws
        run: |
          python3 scripts/product.py disk "artifacts/$TAG/disk"
          df -h /mnt

      - name: Kernel, kexts, collection, GPU, boot disk
        working-directory: ws
        run: |
          python3 scripts/product.py full
          ccache -s

      - name: Stage the new install
        working-directory: ws
        run: python3 scripts/product.py stage

      - name: Pack the image
        working-directory: ws
        run: |
          image="$RUNNER_TEMP/image"
          mkdir -p "$image/plain"
          cp out/product/k27/manifest.json "artifacts/$TAG/disk/disk.json" artifacts/boot-inputs/provenance.json "$image/plain/"
          (cd out/product/k27 && sha256sum boot.img kernel.macho.trustcache) > "$image/plain/sha256.txt"
          (cd "artifacts/$TAG/disk" && sha256sum scratch-data.img && ls -ls data-store.img) >> "$image/plain/sha256.txt"
          # hard links in the workspace's file system: the image's files side by side without a copy
          stage=out/ci-stage
          rm -rf "$stage" && mkdir -p "$stage"
          ln out/product/k27/boot.img out/product/k27/manifest.json out/product/k27/kernel.macho.trustcache \
             "artifacts/$TAG/disk/data-store.img" "artifacts/$TAG/disk/scratch-data.img" "artifacts/$TAG/disk/disk.json" "$stage/"
          scripts/ci-blob.sh pack "$image/image.tar.zst.enc" "$stage" boot.img manifest.json kernel.macho.trustcache \
            data-store.img scratch-data.img disk.json
          cp "$image/image.tar.zst.enc.sha256" "$image/plain/"
          rm -rf "$stage"
          cat "$image/plain/sha256.txt"

      - name: Upload the image (encrypted parts)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ env.TAG }}-${{ github.run_number }}
          path: ${{ runner.temp }}/image/image.tar.zst.enc.*
          compression-level: 0
          retention-days: 14

      - name: Release
        if: inputs.release
        run: |
          release="image-$TAG-${{ github.run_number }}"
          gh release create "$release" --repo "$GITHUB_REPOSITORY" --prerelease --title "k27 $TAG image ${{ github.run_number }} (encrypted)" \
            --notes "boot.img and a new install (data-store.img), ARTIFACT_KEY encrypted: scripts/ci-blob.sh unpack DIR image.tar.zst.enc.[0-9][0-9][0-9]"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/image/image.tar.zst.enc.* "$RUNNER_TEMP"/image/plain/*

      - name: Collect logs
        if: always()
        working-directory: ws
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          cp -r "$RUNNER_TEMP/image/plain" "$logs/" 2>/dev/null || true
          for f in out/k27/build-raw.log out/k27/build-bootstrap.log out/metal/bridge/build.log out/x12377/build/fakeroot-logs \
                   "artifacts/$TAG/inputs-times.json" toolchains/linux/logs; do
            [ -e "$f" ] && cp -r "$f" "$logs/" || true
          done
          df -h / /mnt > "$logs/df.txt"
          ccache -s > "$logs/ccache.txt" 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.TAG }}-${{ github.run_number }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
