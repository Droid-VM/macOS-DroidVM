name: image

# The k27 product from nothing on hosted runners: the build environment from public sources (scripts/setup-env.py,
# configs/env.lock.json), Apple's files from the IPSWs (product.py inputs), a new install (product.py disk, stage) and the boot disk.
# docs/ci-env-plan.md has the design. Seven jobs, the builds side by side:
#
#   inputs ──┬── install (new install) ──────────┐
#            └── kernel (kernel, kexts, KC) ─────┤
#   bridge ──┬── plugin (plugin, apps) ──────────┤
#   turnip ──┘                                   ▼
#                                     image (boot, stage, pack)
#
# Everything holding Apple's files is stored encrypted with the ARTIFACT_KEY secret (scripts/ci-blob.sh: tar keeping holes | zstd |
# AES-256 | parts of 1900 MB):
# - the IPSW inputs as the release inputs-TAG-KEY (KEY: the product's "inputs" and the two IPSW profiles), made once: small
#   (out/kc/kc27.bin and artifacts/TAG but the big members, all the kernel and image jobs need) and large (os.raw, dec/,
#   app-cryptex/, only for the new install);
# - the new install (product.py disk: artifacts/TAG/disk) as the release install-TAG-KEY (KEY: the inputs', the scripts that
#   make it, DarwinBoot's packed_ramdisk and the APFS tools' commits), made once;
# - the kernel collection between the jobs, and the image (boot.img, the new install's data-store.img, scratch-data.img, disk.json,
#   manifests) as the run's artifact image-TAG-RUN (zip storing the parts: compression-level 0), with release=true also as the
#   assets of a release.
# Unpack: ARTIFACT_KEY=... scripts/ci-blob.sh unpack DIR image.tar.zst.enc.[0-9][0-9][0-9]
# The bridge, Turnip and the plugin bundles (our code), logs, hashes and the manifest are plain.
# Single files compressed already (zstd) go up as they are (upload-artifact v7 archive: false, named after the file;
# download-artifact v8 takes them by that name). Release parts are downloaded straight into unpacking (ci-blob.sh fetch).
#
# Caches (actions/cache): toolchains/ (keyed on the lock and the setup scripts), ccache per job (the kernel and Turnip:
# MACOS_CCACHE), the KDK's headers (out/x12377/kdk), the bridge's library by the hash of all its inputs (no build when they are the same; a cargo target directory
# would not help: std and the crates.io crates take seconds, the translator's crates and the fat-LTO bridge are the 7 minutes). The new install's user is the MACOS_USER secret (NAME:PASSWORD) or the
# product's (disk.user). Each job's workspace is on the runner's second disk (/mnt) through a bind mount at ws, so its path stays
# inside the job's workspace (the Darling container mounts it by that path).

on:
  workflow_dispatch:
    inputs:
      refresh_inputs:
        description: Fetch the IPSW inputs again and replace their release
        type: boolean
        default: false
      release:
        description: Also publish the image (encrypted parts) as a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}

env:
  ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
  GH_TOKEN: ${{ github.token }}
  MACOS_CCACHE: /usr/bin/ccache
  CCACHE_MAXSIZE: 2G
  TAG: '27.2'

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Workspace
        run: |
          [ -n "$ARTIFACT_KEY" ] || { echo "::error::the ARTIFACT_KEY secret is not set"; exit 1; }
          sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
        with:
          packages: 'false'
      - name: The inputs' release
        id: have
        working-directory: ws
        env:
          REFRESH: ${{ inputs.refresh_inputs }}
        run: |
          release="inputs-$TAG-$INPUTS_KEY"
          assets=$(gh release view "$release" --json assets -q '.assets[].name' 2>/dev/null || true)
          if [ "$REFRESH" != true ] && grep -qx small.tar.zst.enc.sha256 <<<"$assets" && grep -qx large.tar.zst.enc.sha256 <<<"$assets"; then
            echo "have=true" >> "$GITHUB_OUTPUT"; echo "$release is there"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch, decrypt and publish the inputs
        if: steps.have.outputs.have != 'true'
        working-directory: ws
        run: |
          python3 scripts/setup-env.py sources --part inputs
          python3 scripts/product.py inputs
          release="inputs-$TAG-$INPUTS_KEY"
          parts="$RUNNER_TEMP/inputs"
          big="artifacts/$TAG/os.raw artifacts/$TAG/dec artifacts/$TAG/app-cryptex"
          small=$(find "artifacts/$TAG" -mindepth 1 -maxdepth 1 ! -name os.raw ! -name dec ! -name app-cryptex ! -name disk | sort)
          # shellcheck disable=SC2086
          scripts/ci-blob.sh pack "$parts/small.tar.zst.enc" . out/kc/kc27.bin $small
          # shellcheck disable=SC2086
          scripts/ci-blob.sh pack "$parts/large.tar.zst.enc" . $big
          gh release delete "$release" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$release" --prerelease --title "IPSW inputs $TAG ($INPUTS_KEY, encrypted)" \
            --notes "product.py inputs of configs/product-k27.json (key $INPUTS_KEY), ARTIFACT_KEY encrypted (scripts/ci-blob.sh): small (out/kc/kc27.bin and artifacts/$TAG but os.raw, dec/, app-cryptex/), large (those)."
          gh release upload "$release" "$parts"/*
          cat "artifacts/$TAG/inputs-times.json"

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Workspace
        run: sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
        with:
          rust: 'true'
      - name: The bridge's inputs
        id: key
        working-directory: ws
        # the lock (source commits, SDK, rust nightly), the crates.io versions, the target, the build and its patches, the C compiler
        run: |
          inputs=$( (cat configs/env.lock.json configs/metal-bridge.Cargo.lock configs/arm64e-apple-darwin.json \
                         scripts/build-metal-bridge-macos.py patches/metal2vulkan-macos/*; clang --version) | sha256sum | cut -c1-40)
          echo "key=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: library
        with:
          path: ws/out/metal/bridge/libnative_metal_bridge.a
          key: bridge-library-${{ steps.key.outputs.key }}
      - name: Bridge
        if: steps.library.outputs.cache-hit != 'true'
        working-directory: ws
        run: |
          python3 scripts/setup-env.py sdks
          python3 scripts/setup-env.py sources --part bridge
          python3 scripts/build-metal-bridge-macos.py
      - name: Compress
        working-directory: ws
        run: zstd -T0 -q -f out/metal/bridge/libnative_metal_bridge.a -o "$RUNNER_TEMP/libnative_metal_bridge.a.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/libnative_metal_bridge.a.zst
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-bridge
          path: ws/out/metal/bridge/build.log
          if-no-files-found: ignore

  turnip:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/ws/.ccache
    steps:
      - name: Workspace
        run: sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
      - uses: actions/cache@v4
        with:
          path: ws/toolchains
          key: toolchains-${{ env.TOOLCHAIN_KEY }}
      - uses: actions/cache@v4
        with:
          path: ws/.ccache
          key: ccache-turnip-${{ github.run_id }}
          restore-keys: ccache-turnip-
      - name: Turnip
        working-directory: ws
        run: |
          python3 scripts/setup-env.py toolchain
          python3 scripts/setup-env.py sources --part turnip
          python3 scripts/build-droidvm-gpu.py --export-only
          python3 scripts/build-turnip-macos.py
          tar -cf - out/metal/mesa-tu/src/freedreno/vulkan/libvulkan_freedreno.dylib | zstd -T0 -q -o "$RUNNER_TEMP/turnip.tar.zst"
          ccache -s
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/turnip.tar.zst
          archive: false
          retention-days: 1

  kernel:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/ws/.ccache
    steps:
      - name: Workspace
        run: sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
      - uses: actions/cache@v4
        with:
          path: ws/toolchains
          key: toolchains-${{ env.TOOLCHAIN_KEY }}
      - uses: actions/cache@v4
        with:
          path: ws/.ccache
          key: ccache-kernel-${{ github.run_id }}
          restore-keys: ccache-kernel-
      - uses: actions/cache@v4
        with:
          path: ws/out/x12377/kdk
          key: kdk-${{ env.KDK_KEY }}
      - name: Build environment
        working-directory: ws
        run: |
          python3 scripts/setup-env.py toolchain
          python3 scripts/setup-env.py x12377
          python3 scripts/setup-env.py sources --part kernel
      - name: The inputs' small part
        working-directory: ws
        run: |
          scripts/ci-blob.sh fetch "inputs-$TAG-$INPUTS_KEY" small.tar.zst.enc .
      - name: Kernel, kexts, collection
        working-directory: ws
        run: |
          python3 scripts/product.py kernel
          python3 scripts/product.py kexts
          python3 scripts/product.py kc
          # one part: an artifact uploaded as it is is one file
          CI_BLOB_CHUNK=100G scripts/ci-blob.sh pack "$RUNNER_TEMP/kc/kc.tar.zst.enc" . out/k27/kc-k27.bin
          ccache -s
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/kc/kc.tar.zst.enc.000
          archive: false
          retention-days: 1
      - name: Collect logs
        if: always()
        working-directory: ws
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for f in out/k27/build-raw.log out/k27/build-bootstrap.log out/k27/kc-build.log out/x12377/build/fakeroot-logs toolchains/linux/logs; do
            if [ -e "$f" ]; then cp -r "$f" "$RUNNER_TEMP/logs/"; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-kernel
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  plugin:
    needs: [bridge, turnip]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Workspace
        run: sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
      - uses: actions/cache@v4
        with:
          path: ws/toolchains
          key: toolchains-${{ env.TOOLCHAIN_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: libnative_metal_bridge.a.zst
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: turnip.tar.zst
          path: ${{ runner.temp }}
      - name: Plugin and apps
        working-directory: ws
        run: |
          mkdir -p out/metal/bridge
          zstd -d -q -f "$RUNNER_TEMP/libnative_metal_bridge.a.zst" -o out/metal/bridge/libnative_metal_bridge.a
          zstd -d -q -c "$RUNNER_TEMP/turnip.tar.zst" | tar -xf -
          python3 scripts/setup-env.py toolchain
          python3 scripts/setup-env.py sources --part plugin
          python3 scripts/product.py gpu
          tar -cf - out/metal/plugin/NativeAdrenoMetal.bundle "out/metal/shader-cache/Shader Cache.app" | zstd -T0 -q -o "$RUNNER_TEMP/bundles.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/bundles.tar.zst
          archive: false
          retention-days: 1

  install:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Workspace
        run: sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
      - name: The new install's release
        id: have
        working-directory: ws
        env:
          REFRESH: ${{ inputs.refresh_inputs }}
        run: |
          release="install-$TAG-$INSTALL_KEY"
          assets=$(gh release view "$release" --json assets -q '.assets[].name' 2>/dev/null || true)
          if [ "$REFRESH" != true ] && grep -qx install.tar.zst.enc.sha256 <<<"$assets"; then
            echo "have=true" >> "$GITHUB_OUTPUT"; echo "$release is there"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make and publish the new install
        if: steps.have.outputs.have != 'true'
        working-directory: ws
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          python3 scripts/setup-env.py sources --part install
          scripts/ci-blob.sh fetch "inputs-$TAG-$INPUTS_KEY" small.tar.zst.enc .
          scripts/ci-blob.sh fetch "inputs-$TAG-$INPUTS_KEY" large.tar.zst.enc .
          python3 scripts/product.py disk "artifacts/$TAG/disk"
          release="install-$TAG-$INSTALL_KEY"
          scripts/ci-blob.sh pack "$RUNNER_TEMP/install/install.tar.zst.enc" . "artifacts/$TAG/disk"
          gh release delete "$release" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$release" --prerelease --title "New install $TAG ($INSTALL_KEY, encrypted)" \
            --notes "product.py disk artifacts/$TAG/disk from the inputs inputs-$TAG-$INPUTS_KEY (key $INSTALL_KEY), ARTIFACT_KEY encrypted (scripts/ci-blob.sh)."
          gh release upload "$release" "$RUNNER_TEMP"/install/*
          df -h /mnt

  image:
    needs: [inputs, install, kernel, plugin]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MACOS_USER: ${{ secrets.MACOS_USER }}
    steps:
      - name: Workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/ws && sudo chown "$(id -u):$(id -g)" /mnt/ws && mkdir -p ws && sudo mount --bind /mnt/ws ws
          df -h / /mnt
      - uses: actions/checkout@v4
        with:
          path: ws
      - uses: ./ws/.github/actions/host
      - name: Sources and boot loaders
        working-directory: ws
        run: python3 scripts/setup-env.py sources --part image
      - name: The inputs' small part and the new install
        working-directory: ws
        run: |
          scripts/ci-blob.sh fetch "inputs-$TAG-$INPUTS_KEY" small.tar.zst.enc .
          scripts/ci-blob.sh fetch "install-$TAG-$INSTALL_KEY" install.tar.zst.enc .
          du -sh "artifacts/$TAG"
          df -h /mnt
      - uses: actions/download-artifact@v8
        with:
          name: kc.tar.zst.enc.000
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: bundles.tar.zst
          path: ${{ runner.temp }}
      - name: Boot disk and the install's Data
        working-directory: ws
        run: |
          scripts/ci-blob.sh unpack . "$RUNNER_TEMP/kc.tar.zst.enc.000"
          zstd -d -q -c "$RUNNER_TEMP/bundles.tar.zst" | tar -xf -
          python3 scripts/product.py boot
          python3 scripts/product.py stage
      - name: Pack the image
        working-directory: ws
        run: |
          image="$RUNNER_TEMP/image"
          mkdir -p "$image/plain"
          cp out/product/k27/manifest.json "artifacts/$TAG/disk/disk.json" artifacts/boot-inputs/provenance.json "$image/plain/"
          (cd out/product/k27 && sha256sum boot.img kernel.macho.trustcache) > "$image/plain/sha256.txt"
          (cd "artifacts/$TAG/disk" && sha256sum scratch-data.img && ls -ls data-store.img) >> "$image/plain/sha256.txt"
          # hard links in the workspace's file system: the image's files side by side without a copy
          stage=out/ci-stage
          rm -rf "$stage" && mkdir -p "$stage"
          ln out/product/k27/boot.img out/product/k27/manifest.json out/product/k27/kernel.macho.trustcache \
             "artifacts/$TAG/disk/data-store.img" "artifacts/$TAG/disk/scratch-data.img" "artifacts/$TAG/disk/disk.json" "$stage/"
          scripts/ci-blob.sh pack "$image/image.tar.zst.enc" "$stage" boot.img manifest.json kernel.macho.trustcache \
            data-store.img scratch-data.img disk.json
          cp "$image/image.tar.zst.enc.sha256" "$image/plain/"
          rm -rf "$stage"
          cat "$image/plain/sha256.txt"
      # the encrypted parts in one artifact: zip storing them as they are (compression-level 0), one upload instead of one per part
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ env.TAG }}-${{ github.run_number }}
          path: ${{ runner.temp }}/image/image.tar.zst.enc.[0-9][0-9][0-9]
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-${{ env.TAG }}-${{ github.run_number }}-plain
          path: ${{ runner.temp }}/image/plain
          if-no-files-found: ignore
      - name: Release
        if: inputs.release
        run: |
          release="image-$TAG-${{ github.run_number }}"
          gh release create "$release" --repo "$GITHUB_REPOSITORY" --prerelease --title "k27 $TAG image ${{ github.run_number }} (encrypted)" \
            --notes "boot.img and a new install (data-store.img), ARTIFACT_KEY encrypted: scripts/ci-blob.sh unpack DIR image.tar.zst.enc.[0-9][0-9][0-9]"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/image/image.tar.zst.enc.* "$RUNNER_TEMP"/image/plain/*
